[metadata]
name = trt-reliability-lab
version = 0.1.0
description = CPU-only benchmark reporting tools for TensorRT reliability experiments

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    trt-reliability-report = trt_lab.cli:main
